name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ── Windows (native) ──────────────────────────────────────────────────────
  build-windows:
    name: Windows (x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: pass-cli-windows
          path: target/release/pass-cli.exe

  # ── Linux ─────────────────────────────────────────────────────────────────
  build-linux:
    name: Linux (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libfontconfig1-dev libfreetype6-dev pkg-config
      - name: Build
        run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: pass-cli-linux-x64
          path: target/release/pass-cli

  # ── macOS Intel (cross-compiled on Apple Silicon) ─────────────────────────
  build-macos-intel:
    name: macOS Intel (x86_64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - name: Build
        run: cargo build --release --target x86_64-apple-darwin
      - uses: actions/upload-artifact@v4
        with:
          name: pass-cli-macos-x64
          path: target/x86_64-apple-darwin/release/pass-cli

  # ── macOS Apple Silicon (native) ─────────────────────────────────────────
  build-macos-arm64:
    name: macOS Apple Silicon (aarch64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: pass-cli-macos-arm64
          path: target/release/pass-cli

  # ── Package & publish release ─────────────────────────────────────────────
  release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux, build-macos-intel, build-macos-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract tag annotation (release notes)
        id: tag_notes
        run: |
          NOTES=$(git tag -l --format='%(contents)' "${{ github.ref_name }}")
          {
            echo "body<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with: { name: pass-cli-windows,    path: artifacts/windows }
      - uses: actions/download-artifact@v4
        with: { name: pass-cli-linux-x64,  path: artifacts/linux }
      - uses: actions/download-artifact@v4
        with: { name: pass-cli-macos-x64,  path: artifacts/macos-x64 }
      - uses: actions/download-artifact@v4
        with: { name: pass-cli-macos-arm64, path: artifacts/macos-arm64 }

      - name: Package archives
        run: |
          VERSION="${GITHUB_REF_NAME}"
          mkdir -p releases

          cp artifacts/windows/pass-cli.exe pass-cli.exe
          zip "releases/pass-cli-${VERSION}-windows-x64.zip" pass-cli.exe

          cp artifacts/linux/pass-cli pass-cli && chmod +x pass-cli
          tar -czf "releases/pass-cli-${VERSION}-linux-x64.tar.gz" pass-cli

          cp artifacts/macos-x64/pass-cli pass-cli && chmod +x pass-cli
          tar -czf "releases/pass-cli-${VERSION}-macos-x64.tar.gz" pass-cli

          cp artifacts/macos-arm64/pass-cli pass-cli && chmod +x pass-cli
          tar -czf "releases/pass-cli-${VERSION}-macos-arm64.tar.gz" pass-cli

          ls -lh releases/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: releases/*
          body: ${{ steps.tag_notes.outputs.body }}
          generate_release_notes: true
